[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "german-language-engine"
version = "0.1.0"
description = "Structural German expression/chunk analysis engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
nlp = ["spacy>=3.8,<4"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
gle = "german_language_engine.cli:main"
gle-serve = "german_language_engine.api:main"
[tool.hatch.build.targets.wheel]
packages = ["src/german_language_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
