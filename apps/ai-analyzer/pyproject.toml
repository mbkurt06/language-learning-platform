[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "language-learning-ai-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
