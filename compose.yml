name: language-learning-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-language_learning}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-language_learning}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  translation:
    image: libretranslate/libretranslate:v1.9.6
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-de,en,tr}
      LT_DISABLE_WEB_UI: "true"
    ports:
      - "5001:5000"
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://platform:platform@postgres:5432/language_learning}
      LANGUAGE_ENGINE_URLS: '${LANGUAGE_ENGINE_URLS:-{"de":"http://host.docker.internal:8765"}}'
      TRANSLATION_URL: ${TRANSLATION_URL:-http://translation:5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:5173}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      translation:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
