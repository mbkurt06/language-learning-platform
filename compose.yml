name: language-learning-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-language_learning}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-language_learning}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  translation:
    image: libretranslate/libretranslate:v1.9.6
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-de,en,tr}
      LT_DISABLE_WEB_UI: "true"
    ports:
      - "5001:5000"
    restart: unless-stopped

  german-engine:
    build:
      context: ./apps/german-engine
    environment:
      GLE_TRANSLATION_URL: ${GLE_TRANSLATION_URL:-http://translation:5000}
      GLE_LEXICAL_DB: ${GLE_LEXICAL_DB:-/data/lexical/german-lexical.sqlite3}
    volumes:
      - ./data/lexical:/data/lexical:ro
    ports:
      - "8765:8765"
    depends_on:
      translation:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ai-analyzer:
    build:
      context: ./apps/ai-analyzer
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8780:8780"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8780/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://platform:platform@postgres:5432/language_learning}
      LANGUAGE_ENGINE_URLS: '${LANGUAGE_ENGINE_URLS:-{"de":"http://german-engine:8765"}}'
      TRANSLATION_URL: ${TRANSLATION_URL:-http://translation:5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:5173}
      CORS_ORIGIN_REGEX: '${CORS_ORIGIN_REGEX:-^https://(www\.)?youtube\.com$|^https://([^.]+\.)?zdf\.de$|^https://([^.]+\.)?ardmediathek\.de$|^chrome-extension://.*$}'
      AI_ANALYZER_URL: ${AI_ANALYZER_URL:-http://ai-analyzer:8780}
      AI_ANALYSIS_SCHEMA_VERSION: ${AI_ANALYSIS_SCHEMA_VERSION:-v1}
      AI_BATCH_SEGMENTS: ${AI_BATCH_SEGMENTS:-20}
      AI_BATCH_CONCURRENCY: ${AI_BATCH_CONCURRENCY:-2}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON: ${GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      translation:
        condition: service_started
      german-engine:
        condition: service_healthy
      ai-analyzer:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
